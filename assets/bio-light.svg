<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150"><g font-family="monospace"><text x="0" y="24" fill="#d65068" font-size="13" letter-spacing="1.5">behind /godmode</text><g fill="#302830" font-size="14"><text x="0" y="61">↳ здесь всё постепенно становится моим</text><text x="0" y="88">↳ минимализм, но с приколами</text><text x="0" y="115">↳ кота не будить. серьёзно.</text></g><g text-anchor="end" font-size="14"><text x="750" y="59" fill="#786b70">outside the infinity:</text><text x="750" y="88" fill="#302830">музыка на повторе.</text><text x="750" y="115" fill="#302830">остальное подождёт.</text></g></g></svg>